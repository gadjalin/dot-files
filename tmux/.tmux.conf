# Behaviour
set -g mouse on
setw -g mode-keys vi
set-option -g allow-rename off

# Copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel # "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel # "pbcopy"

# Pane selection
bind h select-pane -L 
bind j select-pane -D 
bind k select-pane -U 
bind l select-pane -R

# Theme: colors live in ~/.tmux/themes/
set -g @theme vhswave87
source-file -F "$HOME/.tmux/themes/#{@theme}.conf"

# Panes
set -g pane-border-lines double

# Statusbar (@theme_dim is the dimmed window name)
set -g status on
set -g status-keys vi

set -g status-position bottom
set -g status-justify absolute-centre

set -g status-left ' #(whoami)@#h (#(echo #{pane_current_path} | $HOME/.local/bin/short-path 30)) |'
set -g status-left-length 50

set -g status-right "| %b %e (week %V, PhD day #($HOME/.local/bin/gad-phd-days)), %Y  %H:%M "
set -g status-right-length 50

setw -g window-status-current-format ' [#S] (#W#F) '
setw -g window-status-format ' #I #[fg=#{@theme_dim}]#W#F '

# Deactivate bell rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir '~/.tmux/resurrect'

set -as terminal-features ',xterm-256color:RGB'

