general.import = [ "~/.config/alacritty/themes/vaporwave87.toml" ]

general.working_directory = "@HOME@/"
general.live_config_reload = true

[window]
startup_mode = "Windowed"
decorations = "Full"
padding = {x = 3, y = 3}

[font]
normal      = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
bold        = { family = "MesloLGS Nerd Font Mono", style = "Bold" }
italic      = { family = "MesloLGS Nerd Font Mono", style = "Italic" }
bold_italic = { family = "MesloLGS Nerd Font Mono", style = "Bold Italic" }
size = 16.0

#[colors]
#transparent_background_colors = true

[bell]
duration = 0

[mouse]
hide_when_typing = true
bindings = [
    { mouse = "Right", mods = "Control", action = "Paste" }
]


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
